name: Secrets demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Variables are visible
        run: echo "Region is ${{ vars.DEMO_REGION }}"

      - name: Secrets are masked
        run: echo "Secret is ${{ secrets.DEMO_SECRET }}"

      - name: Masking is only string matching
        run: echo "${{ secrets.DEMO_SECRET }}" | base64

      - name: Correct way to pass a secret to a command
        env:
          MY_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "secret is present, length ${#MY_SECRET}"
          else
            echo "secret is empty"
          fi
